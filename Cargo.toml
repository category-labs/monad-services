[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
monad-archive      = { path = "./crates/monad-archive" }
monad-query-schema = { path = "./crates/monad-query-schema" }
monad-query-store  = { path = "./crates/monad-query-store" }
monad-query-types  = { path = "./crates/monad-query-types" }
monad-query-write  = { path = "./crates/monad-query-write" }

monad-compress     = { git = "https://github.com/category-labs/monad-bft", tag = "v0.16.0" }
monad-eth-testutil = { git = "https://github.com/category-labs/monad-bft", tag = "v0.16.0" }
monad-eth-types    = { git = "https://github.com/category-labs/monad-bft", tag = "v0.16.0" }
monad-triedb-utils = { git = "https://github.com/category-labs/monad-bft", tag = "v0.16.0" }
monad-types        = { git = "https://github.com/category-labs/monad-bft", tag = "v0.16.0" }

alloy-consensus = "2.0"
alloy-eips = "2.0"
alloy-primitives = "1.5"
alloy-rlp = { version = "0.3", features = ["arrayvec"] }
alloy-rpc-types = { version = "2.0", default-features = false, features = ["eth"] }
alloy-signer = "2.0"
alloy-signer-local = "2.0"
auto_impl = "1.3.0"
aws-config = "1.8.13"
aws-sdk-dynamodb = { version = "1.104.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1.122.0", default-features = false, features = ["behavior-version-latest", "sigv4a", "rt-tokio", "default-https-client"] }
base64 = "0.22.1"
bytes = "1.5"
chrono = "0.4.34"
clap = "4.2"
dashmap = "6.1.0"
enum_dispatch = "0.3.13"
eyre = "0.6.12"
futures = "0.3"
governor = "0.10.4"
hex = "0.4"
itertools = "0.13.0"
libsqlite3-sys = "=0.37.0"
mongodb = { version = "3.7.0", default-features = false, features = ["compat-3-0-0", "dns-resolver", "openssl-tls"] }
num_enum = "0.7.6"
opentelemetry = "0.31"
opentelemetry-otlp = "0.31"
opentelemetry-semantic-conventions = "0.29"
opentelemetry_sdk = "0.31"
ratatui = "=0.30.2"
rayon = "1.7"
regex = "1.10.2"
reqwest = { version = "0.12.28", features = ["json"] }
roaring = "=0.11.5"
rocksdb = "=0.25.0"
serde = "1.0"
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false }
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.5"
thiserror = "1.0"
tokio = { version = "1.39", features = ["sync"] }
tokio-retry = "0.3.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5.0"
validator = { version = "0.21.0", features = ["derive"] }
zstd = "0.13"

[profile.dev]
opt-level = 1

[profile.release]
debug = true
lto = "thin"
panic = "abort"
